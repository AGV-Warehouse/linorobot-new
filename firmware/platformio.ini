; linorobot2 base firmware
;   2x CubeMars AK10-9 (MIT mode over CAN) + optional MPU6050 IMU + micro-ROS.
;
; This is the firmware that makes the MCU a micro-ROS node on the linorobot2
; network. The micro-ROS agent is launched on the robot computer by
;   ros2 launch linorobot2_bringup bringup.launch.py
;
; Build & flash (one env per MCU board):
;   pio run -e teensy41 -t upload        Teensy 4.1, CAN2 on pins 0/1
;   pio run -e nucleo_h753zi -t upload   Nucleo-H753ZI over its ST-LINK (CN1),
;                                        FDCAN1 on PD0/PD1 (HARDWARE.md)

[env]
framework = arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
; micro-ROS settings: distro MUST match the ROS 2 distro on the robot computer.
board_microros_distro = jazzy
board_microros_transport = serial

; FlexCAN_T4 is bundled with the Teensy platform, so it is not in lib_deps.
[env:teensy41]
platform = teensy
board = teensy41
; Headless flashing (no Teensy Loader GUI): use the command-line uploader.
; teensy-cli auto-reboots the running board into HalfKay; if it can't, tap the
; physical button on the Teensy to enter the bootloader.
upload_protocol = teensy-cli
; Teensy platform 5.x ships arm-gcc 15, which makes implicit-function-declaration
; a hard error. micro-ROS's rcutils (time_unix.c) calls clock_gettime() with only
; an implicit decl from newlib; demote it back to a warning so the bundled lib
; builds. This flag is forwarded into the micro-ROS CMake build by its extra_script.
build_flags = -Wno-error=implicit-function-declaration

; micro-ROS runs over USART3 -> the ST-LINK virtual COM port (/dev/ttyACM0 on
; the Jetson), so one USB cable on CN1 powers, flashes and talks to the board.
[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
upload_protocol = stlink
; -Wno-error=...: same micro-ROS rcutils fix as the Teensy env (harmless on an
; older gcc). FDCAN HAL is off by default in stm32duino. The 64-byte default UART buffers
; overflow at 921600 baud while a blocking odom publish drains (~700 bytes);
; the Teensy's USB CDC never had that limit.
build_flags =
    -Wno-error=implicit-function-declaration
    -DHAL_FDCAN_MODULE_ENABLED
    -DSERIAL_RX_BUFFER_SIZE=1024
    -DSERIAL_TX_BUFFER_SIZE=1024
