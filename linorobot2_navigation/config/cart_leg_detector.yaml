cart_leg_detector:
  ros__parameters:
    # ---- Cart geometry: MEASURE THE REAL CART (Phase 0 checklist in
    # UNDER_CART_DOCKING.md). All values in meters, leg spacings measured
    # center-of-leg to center-of-leg AT LIDAR SCAN HEIGHT (near the floor),
    # not at the tabletop — angled legs make those differ.
    # Current values: the PRACTICE TABLE (2026-08-04). Tape measure at the
    # top said 0.70 wide, but the lidar clusters at scan height measure
    # 0.63-0.64 (two independent captures); length 1.09 and the 1.27
    # diagonal agree. Re-measure and replace when the real cart arrives.
    rect_length: 1.09        # longer leg-to-leg spacing (at scan height)
    rect_width: 0.64         # shorter leg-to-leg spacing (at scan height)
    leg_diameter: 0.04       # leg cross-section as the lidar sees it

    # ---- Matching tolerances
    dim_tolerance: 0.04      # rectangle side/diagonal match tolerance
    cluster_gap: 0.06        # new cluster when consecutive points jump more
    min_points_per_leg: 3    # clusters with fewer returns are noise
    min_matched_legs: 2      # 2 = works during entry occlusion; raise to 3
                             # for stricter detection when gating is off
    max_range: 3.0           # ignore returns beyond this (m)

    # ---- Gating (the guard against look-alike leg patterns)
    # Detections farther than gate_radius from the last accepted pose (or
    # the expected pose below) are rejected. Set 0.0 ONLY for offline bag
    # exploration.
    gate_radius: 0.5
    # Seed pose before the first detection. Set expected_cart_frame to ''
    # to disable, 'map' to give the pose in map coordinates (transformed via
    # TF), or 'odom' to give it directly in the output frame.
    # 'base_footprint' makes the seed ROBOT-RELATIVE: "the cart center is
    # ~1.4 m straight ahead of wherever I'm parked when the detector
    # starts" (1 m standoff + half the 1.10 m table). Without a seed, a
    # fresh start locks onto the closest leg-like pair — the wire shelf
    # 0.5 m beside the robot won attempt #4. Caveat: the seed tracks the
    # robot, so a lock LOST while under the cart (>detection_timeout)
    # cannot re-acquire — the seed then points 1.4 m past the cart.
    expected_cart_frame: 'base_footprint'
    expected_cart_x: 1.4
    expected_cart_y: 0.0
    expected_cart_yaw: 0.0

    # ---- Output
    filter_alpha: 0.3        # EMA weight of a new detection (1.0 = no filter)
    detection_timeout: 1.0   # s without acceptance before the filter resets
    output_frame: odom       # docking server fixed_frame (navigation.yaml)
    base_frame: base_footprint  # used to aim the entry axis at the robot
                             # on a fresh lock: park square-on to the side
                             # you want to enter before the detector locks
    publish_markers: true    # RViz debugging on cart_leg_detector/markers
